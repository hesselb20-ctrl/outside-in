<title>How Outside-In works: signals, collectors, evidence graph, report</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9CA8C3"/></marker></defs><text x="40" y="56" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#F5B83D" text-anchor="start">1</text><text x="68" y="56" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#EEF2FA" text-anchor="start">Public signals</text><rect x="40" y="104" width="250" height="416" rx="18" fill="#131B2E" stroke="#2A3655" stroke-width="1.5"/><text x="340" y="56" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#F5B83D" text-anchor="start">2</text><text x="368" y="56" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#EEF2FA" text-anchor="start">Collectors</text><rect x="340" y="104" width="250" height="416" rx="18" fill="#131B2E" stroke="#2A3655" stroke-width="1.5"/><text x="640" y="56" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#F5B83D" text-anchor="start">3</text><text x="668" y="56" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#EEF2FA" text-anchor="start">Evidence graph</text><rect x="640" y="104" width="250" height="416" rx="18" fill="#131B2E" stroke="#2A3655" stroke-width="1.5"/><text x="940" y="56" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#F5B83D" text-anchor="start">4</text><text x="968" y="56" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#EEF2FA" text-anchor="start">Report</text><rect x="940" y="104" width="220" height="416" rx="18" fill="#131B2E" stroke="#2A3655" stroke-width="1.5"/><line x1="296" y1="312" x2="332" y2="312" stroke="#9CA8C3" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="596" y1="312" x2="632" y2="312" stroke="#9CA8C3" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="896" y1="312" x2="932" y2="312" stroke="#9CA8C3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="56" y="126" width="218" height="50" rx="12" fill="#1A2440" stroke="#2A3655" stroke-width="1.5"/><circle cx="80" cy="151" r="7" fill="#8E9BFF"/><text x="100" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#EEF2FA" text-anchor="start">Tech fingerprint</text><rect x="56" y="190" width="218" height="50" rx="12" fill="#1A2440" stroke="#2A3655" stroke-width="1.5"/><circle cx="80" cy="215" r="7" fill="#F5B83D"/><text x="100" y="222" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#EEF2FA" text-anchor="start">Pricing history</text><rect x="56" y="254" width="218" height="50" rx="12" fill="#1A2440" stroke="#2A3655" stroke-width="1.5"/><circle cx="80" cy="279" r="7" fill="#3DD6B5"/><text x="100" y="286" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#EEF2FA" text-anchor="start">Job posts</text><rect x="56" y="318" width="218" height="50" rx="12" fill="#1A2440" stroke="#2A3655" stroke-width="1.5"/><circle cx="80" cy="343" r="7" fill="#6EC1FF"/><text x="100" y="350" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#EEF2FA" text-anchor="start">Changelog &amp; feeds</text><rect x="56" y="382" width="218" height="50" rx="12" fill="#1A2440" stroke="#2A3655" stroke-width="1.5"/><circle cx="80" cy="407" r="7" fill="#C58BFF"/><text x="100" y="414" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#EEF2FA" text-anchor="start">DNS and headers</text><rect x="56" y="446" width="218" height="50" rx="12" fill="#1A2440" stroke="#2A3655" stroke-width="1.5"/><circle cx="80" cy="471" r="7" fill="#FF7A66"/><text x="100" y="478" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#EEF2FA" text-anchor="start">App reviews</text><text x="362" y="152" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#EEF2FA" text-anchor="start">One module per signal.</text><text x="362" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9CA8C3" text-anchor="start">Every request passes</text><text x="362" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9CA8C3" text-anchor="start">the same gate:</text><path d="M364 243 l7 7 l13 -15" stroke="#3DD6B5" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="250" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#EEF2FA" text-anchor="start">robots.txt honoured</text><path d="M364 293 l7 7 l13 -15" stroke="#3DD6B5" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#EEF2FA" text-anchor="start">rate limit per host</text><path d="M364 343 l7 7 l13 -15" stroke="#3DD6B5" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="350" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#EEF2FA" text-anchor="start">generic user agent</text><path d="M364 393 l7 7 l13 -15" stroke="#3DD6B5" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#EEF2FA" text-anchor="start">GET only, no logins</text><path d="M364 443 l7 7 l13 -15" stroke="#3DD6B5" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="450" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#EEF2FA" text-anchor="start">no personal data</text><line x1="710" y1="164" x2="798" y2="195" stroke="#2A3655" stroke-width="2.5"/><line x1="710" y1="226" x2="798" y2="195" stroke="#2A3655" stroke-width="2.5"/><line x1="710" y1="300" x2="798" y2="362" stroke="#2A3655" stroke-width="2.5"/><line x1="710" y1="362" x2="798" y2="362" stroke="#2A3655" stroke-width="2.5"/><line x1="710" y1="424" x2="798" y2="362" stroke="#2A3655" stroke-width="2.5"/><line x1="710" y1="486" x2="798" y2="486" stroke="#2A3655" stroke-width="2.5"/><circle cx="686" cy="164" r="24" fill="#1A2440" stroke="#8E9BFF" stroke-width="2.5"/><text x="686" y="170" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" font-weight="600" fill="#EEF2FA" text-anchor="middle">T7</text><circle cx="686" cy="226" r="24" fill="#1A2440" stroke="#C58BFF" stroke-width="2.5"/><text x="686" y="232" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" font-weight="600" fill="#EEF2FA" text-anchor="middle">D3</text><circle cx="686" cy="300" r="24" fill="#1A2440" stroke="#F5B83D" stroke-width="2.5"/><text x="686" y="306" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" font-weight="600" fill="#EEF2FA" text-anchor="middle">P1</text><circle cx="686" cy="362" r="24" fill="#1A2440" stroke="#F5B83D" stroke-width="2.5"/><text x="686" y="368" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" font-weight="600" fill="#EEF2FA" text-anchor="middle">P4</text><circle cx="686" cy="424" r="24" fill="#1A2440" stroke="#3DD6B5" stroke-width="2.5"/><text x="686" y="430" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" font-weight="600" fill="#EEF2FA" text-anchor="middle">J4</text><circle cx="686" cy="486" r="24" fill="#1A2440" stroke="#3DD6B5" stroke-width="2.5"/><text x="686" y="492" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" font-weight="600" fill="#EEF2FA" text-anchor="middle">J10</text><rect x="798" y="173" width="92" height="44" rx="22" fill="#3DD6B5"/><text x="844" y="202" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1120" text-anchor="middle">high</text><rect x="798" y="340" width="92" height="44" rx="22" fill="#F5B83D"/><text x="844" y="369" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1120" text-anchor="middle">medium</text><rect x="798" y="464" width="92" height="44" rx="22" fill="#FF7A66"/><text x="844" y="493" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1120" text-anchor="middle">low</text><text x="960" y="150" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="20" font-weight="600" fill="#EEF2FA" text-anchor="start">report.md</text><text x="960" y="178" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="20" font-weight="600" fill="#EEF2FA" text-anchor="start">report.json</text><rect x="960" y="212" width="180" height="54" rx="12" fill="#1A2440" stroke="#2A3655" stroke-width="1.5"/><text x="976" y="246" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="20" font-weight="400" fill="#EEF2FA" text-anchor="start">claim</text><rect x="960" y="280" width="180" height="54" rx="12" fill="#1A2440" stroke="#2A3655" stroke-width="1.5"/><text x="976" y="314" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="20" font-weight="400" fill="#EEF2FA" text-anchor="start">evidence[]</text><rect x="960" y="348" width="180" height="54" rx="12" fill="#1A2440" stroke="#2A3655" stroke-width="1.5"/><text x="976" y="382" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="20" font-weight="400" fill="#F5B83D" text-anchor="start">confidence</text><rect x="960" y="416" width="180" height="54" rx="12" fill="#1A2440" stroke="#2A3655" stroke-width="1.5"/><text x="976" y="450" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="20" font-weight="400" fill="#EEF2FA" text-anchor="start">unknowns</text><text x="960" y="504" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9CA8C3" text-anchor="start">Every claim cites its source</text>
